<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  Fonts mounted at /fonts are picked up without a rebuild, and the common
  Microsoft names map to their metric-compatible free fonts so documents that
  name them keep their line breaks.
-->
<fontconfig>
  <dir>/fonts</dir>
  <alias binding="same"><family>Arial</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Helvetica</family><accept><family>Liberation Sans</family></accept></alias>
  <alias binding="same"><family>Times New Roman</family><accept><family>Liberation Serif</family></accept></alias>
  <alias binding="same"><family>Courier New</family><accept><family>Liberation Mono</family></accept></alias>
  <alias binding="same"><family>Calibri</family><accept><family>Carlito</family></accept></alias>
  <alias binding="same"><family>Cambria</family><accept><family>Caladea</family></accept></alias>
  <alias binding="same"><family>Segoe UI</family><accept><family>Noto Sans</family></accept></alias>

  <!--
    Windows CJK fonts are not metric-compatible with anything here, so these
    only pick the right script variant: without them Simplified Chinese can
    land in the Hong Kong forms. Serif faces ask for Noto Serif CJK first. It
    is left out of the image, so they get Noto Sans CJK until Noto Serif CJK
    is uploaded or mounted at /fonts.
  -->
  <alias binding="same"><family>SimSun</family><accept><family>Noto Serif CJK SC</family><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="same"><family>NSimSun</family><accept><family>Noto Serif CJK SC</family><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="same"><family>FangSong</family><accept><family>Noto Serif CJK SC</family><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="same"><family>KaiTi</family><accept><family>Noto Serif CJK SC</family><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="same"><family>宋体</family><accept><family>Noto Serif CJK SC</family><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="same"><family>新宋体</family><accept><family>Noto Serif CJK SC</family><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="same"><family>仿宋</family><accept><family>Noto Serif CJK SC</family><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="same"><family>楷体</family><accept><family>Noto Serif CJK SC</family><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="same"><family>Noto Serif CJK SC</family><accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="same"><family>SimHei</family><accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="same"><family>Microsoft YaHei</family><accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="same"><family>DengXian</family><accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="same"><family>黑体</family><accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="same"><family>微软雅黑</family><accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="same"><family>等线</family><accept><family>Noto Sans CJK SC</family></accept></alias>
  <alias binding="same"><family>PMingLiU</family><accept><family>Noto Serif CJK TC</family><family>Noto Sans CJK TC</family></accept></alias>
  <alias binding="same"><family>MingLiU</family><accept><family>Noto Serif CJK TC</family><family>Noto Sans CJK TC</family></accept></alias>
  <alias binding="same"><family>新細明體</family><accept><family>Noto Serif CJK TC</family><family>Noto Sans CJK TC</family></accept></alias>
  <alias binding="same"><family>細明體</family><accept><family>Noto Serif CJK TC</family><family>Noto Sans CJK TC</family></accept></alias>
  <alias binding="same"><family>Noto Serif CJK TC</family><accept><family>Noto Sans CJK TC</family></accept></alias>
  <alias binding="same"><family>Microsoft JhengHei</family><accept><family>Noto Sans CJK TC</family></accept></alias>
  <alias binding="same"><family>微軟正黑體</family><accept><family>Noto Sans CJK TC</family></accept></alias>
  <alias binding="same"><family>MS Mincho</family><accept><family>Noto Serif CJK JP</family><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>MS PMincho</family><accept><family>Noto Serif CJK JP</family><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Yu Mincho</family><accept><family>Noto Serif CJK JP</family><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>ＭＳ 明朝</family><accept><family>Noto Serif CJK JP</family><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>ＭＳ Ｐ明朝</family><accept><family>Noto Serif CJK JP</family><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>游明朝</family><accept><family>Noto Serif CJK JP</family><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Noto Serif CJK JP</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>MS Gothic</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>MS PGothic</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Yu Gothic</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Meiryo</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>ＭＳ ゴシック</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>ＭＳ Ｐゴシック</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>游ゴシック</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>メイリオ</family><accept><family>Noto Sans CJK JP</family></accept></alias>
  <alias binding="same"><family>Batang</family><accept><family>Noto Serif CJK KR</family><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>BatangChe</family><accept><family>Noto Serif CJK KR</family><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>Gungsuh</family><accept><family>Noto Serif CJK KR</family><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>바탕</family><accept><family>Noto Serif CJK KR</family><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>궁서</family><accept><family>Noto Serif CJK KR</family><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>Noto Serif CJK KR</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>Gulim</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>Dotum</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>Malgun Gothic</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>굴림</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>돋움</family><accept><family>Noto Sans CJK KR</family></accept></alias>
  <alias binding="same"><family>맑은 고딕</family><accept><family>Noto Sans CJK KR</family></accept></alias>
</fontconfig>
