name: release

# A tag such as v0.1.1 publishes ghcr.io/crafted-systems/rusticdoc:0.1.1 for amd64 and
# arm64. Each architecture builds on a runner of its own, because building the
# Servo style engine under emulation takes hours; the two images are then
# joined under one tag. Versions follow ZeroVer (https://0ver.org): they stay
# below 1.0, and a new minor number may break compatibility. The image carries
# a signed provenance attestation, stored beside it in the registry, which
# `gh attestation verify oci://<image>:<version> --repo <owner>/<repo>` checks.
on:
  push:
    tags: ['v0.*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to publish, such as v0.1.0
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/crafted-systems/rusticdoc
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: image (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check the tag
        shell: bash
        run: |
          [[ "$TAG" =~ ^v0\.[0-9]+\.[0-9]+$ ]] || { echo "not a version tag such as v0.1.0: $TAG"; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: smoke
        run: |
          docker run -d --name rd -p 9027:9027 "${IMAGE}@${{ steps.build.outputs.digest }}"
          for i in $(seq 1 60); do curl -sf localhost:9027/health && break; sleep 1; done
          printf 'Hello {{ name }}' > t.txt
          curl -sf -F template=@t.txt -F 'data={"name":"release"}' -F steps=convert localhost:9027/v1/render -o out.pdf
          head -c 4 out.pdf | grep -q PDF
          docker rm -f rd
      - name: keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Artifact file names cannot hold the colon in sha256:<hex>.
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    name: tag the image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: join the architectures under the version
        id: join
        working-directory: digests
        run: |
          version="${TAG#v}"
          docker buildx imagetools create -t "${IMAGE}:${version}" \
            $(printf "${IMAGE}@sha256:%s " $(ls | sed 's/^sha256://'))
          docker buildx imagetools inspect "${IMAGE}:${version}"
          digest="$(docker buildx imagetools inspect "${IMAGE}:${version}" --format '{{json .Manifest}}' | jq -r .digest)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "no digest for ${IMAGE}:${version}"; exit 1; }
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: attest the image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.join.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
