name: release

# A tag such as v0.1.0 publishes ghcr.io/vmosoti/rusticdoc:0.1.0 for amd64 and
# arm64. Each architecture builds on a runner of its own, because building the
# Servo style engine under emulation takes hours; the two images are then
# joined under one tag. Versions follow ZeroVer (https://0ver.org): they stay
# below 1.0, and a new minor number may break compatibility.
on:
  push:
    tags: ['v0.*']
  workflow_dispatch:
    inputs:
      tag:
        description: An existing tag to publish, such as v0.1.0
        required: true

permissions:
  contents: read

env:
  IMAGE: ghcr.io/vmosoti/rusticdoc
  TAG: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: image (${{ matrix.arch }})
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check the tag
        shell: bash
        run: |
          [[ "$TAG" =~ ^v0\.[0-9]+\.[0-9]+$ ]] || { echo "not a version tag such as v0.1.0: $TAG"; exit 1; }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ env.TAG }}
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: build and push by digest
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.TAG }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: smoke
        run: |
          docker run -d --name rd -p 9027:9027 "${IMAGE}@${{ steps.build.outputs.digest }}"
          for i in $(seq 1 60); do curl -sf localhost:9027/health && break; sleep 1; done
          printf 'Hello {{ name }}' > t.txt
          curl -sf -F template=@t.txt -F 'data={"name":"release"}' -F steps=convert localhost:9027/v1/render -o out.pdf
          head -c 4 out.pdf | grep -q PDF
          docker rm -f rd
      - name: keep the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          # Artifact file names cannot hold the colon in sha256:<hex>.
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/*
          retention-days: 1

  publish:
    name: tag the image
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: join the architectures under the version
        working-directory: digests
        run: |
          version="${TAG#v}"
          docker buildx imagetools create -t "${IMAGE}:${version}" \
            $(printf "${IMAGE}@sha256:%s " $(ls | sed 's/^sha256://'))
          docker buildx imagetools inspect "${IMAGE}:${version}"
