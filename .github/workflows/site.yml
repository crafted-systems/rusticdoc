name: site

on:
  push:
    branches: [main]
    paths: ['site/**', 'openapi.json', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'openapi.json', '.github/workflows/site.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: The API reference matches openapi.json
        run: npm run check:reference
        env:
          SKIP_CLI: '1'
      - name: The configuration reference matches the code
        run: npm run check:config
      - run: npm run build
      - run: npm run check:links
