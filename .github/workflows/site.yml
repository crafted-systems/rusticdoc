name: site

on:
  push:
    branches: [main]
    paths: ['site/**', 'openapi.json', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'openapi.json', '.github/workflows/site.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: The API reference matches openapi.json
        run: npm run check:reference
        env:
          SKIP_CLI: '1'
      - name: The configuration reference matches the code
        run: npm run check:config
      - run: npm run build
      - run: npm run check:links
      # The checks above run on the site as rusticdoc.com serves it, at the
      # root. Until that domain is live, Pages serves it under the
      # repository's path, so it is built again there for upload.
      - name: Build for GitHub Pages
        run: |
          rm -rf node_modules/.astro .astro dist
          SITE_URL=https://vmosoti.github.io SITE_BASE=/rusticdoc npm run build
          node scripts/rebase.mjs /rusticdoc
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: site/dist

  # Publishes to GitHub Pages, at https://vmosoti.github.io/rusticdoc/, once the
  # repository variable SITE_DEPLOY is set to github-pages. Pages does not apply
  # public/_headers; see site/RELEASE.md.
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && vars.SITE_DEPLOY == 'github-pages'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages.outputs.page_url }}
    steps:
      - id: pages
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
