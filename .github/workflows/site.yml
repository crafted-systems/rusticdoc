name: site

on:
  push:
    branches: [main]
    paths: ['site/**', 'openapi.json', '.github/workflows/site.yml']
  pull_request:
    paths: ['site/**', 'openapi.json', '.github/workflows/site.yml']

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
      - name: The API reference matches openapi.json
        run: npm run check:reference
        env:
          SKIP_CLI: '1'
      - name: The configuration reference matches the code
        run: npm run check:config
      - run: npm run build
      - run: npm run check:links
