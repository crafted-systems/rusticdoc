name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  # Test binaries link the Servo style engine and the PDF stack; with full
  # debug info and incremental artifacts they filled the runner's disk and the
  # linker died with a bus error. Line tables keep backtraces readable.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only
  CARGO_INCREMENTAL: '0'

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - name: Make room on the runner
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - name: OpenAPI is in sync
        run: |
          cargo run -q -p rusticdoc -- openapi > /tmp/openapi.json
          diff -u openapi.json /tmp/openapi.json

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: 1.99.1
      - run: cargo install cargo-audit --version 0.22.2 --locked
      - run: cargo audit

  image:
    name: docker image
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: rusticdoc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke
        run: |
          docker run -d --name rd -p 9027:9027 rusticdoc:ci
          for i in $(seq 1 60); do curl -sf localhost:9027/health && break; sleep 1; done
          printf 'Hello {{ name }}' > t.txt
          curl -sf -F template=@t.txt -F 'data={"name":"CI"}' -F steps=convert localhost:9027/v1/render -o out.pdf
          head -c 4 out.pdf | grep -q PDF
          docker logs rd | tail -5
          docker rm -f rd
      - name: several replicas on one store
        run: test/store/replicas.sh rusticdoc:ci
