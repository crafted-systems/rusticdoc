name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked
      - run: cargo test --workspace --locked
      - name: OpenAPI is in sync
        run: |
          cargo run -q -p rusticdoc -- openapi > /tmp/openapi.json
          diff -u openapi.json /tmp/openapi.json

  image:
    name: docker image
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: rusticdoc:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: smoke
        run: |
          docker run -d --name rd -p 3000:3000 rusticdoc:ci
          for i in $(seq 1 60); do curl -sf localhost:3000/health && break; sleep 1; done
          printf 'Hello {{ name }}' > t.txt
          curl -sf -F template=@t.txt -F 'data={"name":"CI"}' -F steps=convert localhost:3000/v1/render -o out.pdf
          head -c 4 out.pdf | grep -q PDF
          docker logs rd | tail -5
          docker rm -f rd
