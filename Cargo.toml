[workspace]
members = ["crates/core", "crates/server", "crates/cli", "crates/template"]
resolver = "2"

[workspace.package]
version = "0.1.3"
edition = "2021"
license = "Apache-2.0"
repository = "https://github.com/crafted-systems/rusticdoc"
rust-version = "1.88"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
