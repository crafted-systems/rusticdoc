[package]
name = "rusticdoc"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
libc = "0.2"
clap = { version = "4.6.7", features = ["derive", "env"] }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json"] }
rusticdoc-core = { version = "0.1.0", path = "../core" }
rusticdoc-server = { version = "0.1.0", path = "../server" }
rusticdoc-template = { version = "0.1.0", path = "../template" }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["full"] }
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
utoipa = "6.0.0"
