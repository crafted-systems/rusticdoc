[package]
name = "rusticdoc-server"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart", "json", "macros"] }
base64 = "0.23.1"
bytes = "1.12.1"
futures-util = "0.3.34"
hex = "0.4.3"
hmac = "0.13.0"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio", "service"] }
http = "1.5.0"
http-body-util = "0.1.5"
libc = "0.2"
jsonwebtoken = { version = "11.1.0", default-features = false, features = ["aws_lc_rs", "use_pem"] }
mime = "0.3.18"
minijinja = { version = "3.0.5", features = ["serde", "json", "fuel"] }
prometheus-client = "0.25.2"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["rustls", "json", "multipart"] }
rusticdoc-core = { version = "0.1.0", path = "../core" }
rusticdoc-template = { version = "0.1.0", path = "../template" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
subtle = "2"
tokio = { version = "1.54.1", features = ["full"] }
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.7.1", features = ["trace", "timeout", "limit", "cors", "request-id", "catch-panic", "util", "set-header"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter"] }
utoipa = { version = "6.0.0", features = ["axum_extras", "uuid"] }
utoipa-scalar = { version = "0.4.0", features = ["axum"] }
uuid = { version = "1.29.0", features = ["v4"] }
zip = { version = "9.4.0", default-features = false, features = ["deflate"] }

[dev-dependencies]
lopdf = "0.47.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full"] }
