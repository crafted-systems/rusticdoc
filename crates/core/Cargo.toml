[package]
name = "rusticdoc-core"
version = "0.1.0"
edition = "2024"

[dependencies]
bytes = "1.12.1"
hex = "0.4.3"
minijinja = { version = "3.0.5", features = ["serde", "json", "fuel"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "time", "fs", "io-util", "macros", "rt-multi-thread", "sync"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4"] }
