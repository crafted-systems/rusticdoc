[package]
name = "rusticdoc-core"
version = "0.1.0"
edition = "2024"
license.workspace = true

[dependencies]
async-trait = "0.1.92"
# The private-key operations of PDF signing. RustCrypto's `rsa` has an unpatched
# timing advisory (RUSTSEC-2023-0071), and the server already builds aws-lc-rs.
aws-lc-rs = "1.19.0"
bytes = "1.12.1"
# CMS and X.509 structures for PDF signatures: encoding and parsing only, no
# secret-dependent arithmetic.
cms = { version = "0.2.3", default-features = false, features = ["std"] }
der = { version = "0.7.10", features = ["alloc", "derive", "oid", "pem", "std"] }
x509-cert = { version = "0.2.5", default-features = false, features = ["pem", "std"] }
flate2 = "1.1.10"
# HTML to PDF without a browser: Servo's style engine, Taffy layout, Krilla PDF.
fulgur = "0.41.0"
fontdb = { version = "0.24.0", default-features = false, features = ["fs", "fontconfig"] }
hex = "0.4.3"
# Blitz pins 0.25.6 exactly.
image = { version = "0.25.6", default-features = false, features = ["jpeg"] }
libc = "0.2"
lopdf = { version = "0.47.0", features = ["embed_image"] }
# Form text outside Latin: Fulgur's own text engine and PDF writer, used
# directly to shape it and embed subset fonts.
parley = "0.6.0"
krilla = "0.7.0"
minijinja = { version = "3.0.5", features = ["serde", "json", "fuel"] }
quick-xml = "0.41.0"
rusticdoc-template = { version = "0.1.0", path = "../template" }
url = "2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "time", "fs", "io-util", "macros", "rt-multi-thread", "sync"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4", "v7"] }
zip = { version = "9.4.0", default-features = false, features = ["deflate"] }
object_store = { version = "0.14.2", default-features = false, features = ["aws", "fs"] }
futures-util = "0.3.34"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
x509-tsp = "0.1.0"
x509-ocsp = "0.2.1"
cryptoki = "0.12.1"
cmpv2 = "0.2.0"

[dev-dependencies]
rcgen = { version = "0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
