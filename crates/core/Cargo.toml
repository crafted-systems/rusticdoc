[package]
name = "rusticdoc-core"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
flate2 = "1.1.10"
fontdb = { version = "0.24.0", default-features = false, features = ["fs", "fontconfig"] }
hex = "0.4.3"
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
libc = "0.2"
lopdf = { version = "0.47.0", features = ["embed_image"] }
minijinja = { version = "3.0.5", features = ["serde", "json", "fuel"] }
quick-xml = "0.42.0"
rusticdoc-template = { version = "0.1.0", path = "../template" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tempfile = "3.27.0"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["process", "time", "fs", "io-util", "macros", "rt-multi-thread", "sync"] }
tracing = "0.1.44"
uuid = { version = "1.29.0", features = ["v4"] }
zip = { version = "9.3.0", default-features = false, features = ["deflate"] }
